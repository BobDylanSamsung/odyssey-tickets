name: Watch sessions

on:
  workflow_dispatch:
  schedule:
  # Hourly, at 17 past.
  - cron: '17 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-sessions

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Check for sessions
      id: check
      run: ./check.py

    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A sessions
        git commit -m "Sessions as at $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
        for delay in 2 4 8 16 0; do
          git pull --rebase && git push && exit 0
          [ "$delay" = 0 ] && exit 1
          sleep "$delay"
        done

    - name: Raise an issue for new sessions
      if: steps.check.outputs.new_dates != ''
      uses: actions/github-script@v7
      env:
        NEW_DATES: ${{ steps.check.outputs.new_dates }}
        NEW_BODY: ${{ steps.check.outputs.new_body }}
      with:
        script: |
          const dates = process.env.NEW_DATES;
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `The Odyssey — new sessions on sale for ${dates}`,
            assignees: [context.repo.owner],
            body: [
              `New sessions are now on sale for **${dates}** at IMAX Sydney.`,
              '',
              process.env.NEW_BODY,
              'Seat counts are from the moment of the check — book early.',
            ].join('\n'),
          });

    - name: Raise an issue when seats free up
      if: steps.check.outputs.seat_dates != ''
      uses: actions/github-script@v7
      env:
        SEAT_DATES: ${{ steps.check.outputs.seat_dates }}
        SEAT_BODY: ${{ steps.check.outputs.seat_body }}
      with:
        script: |
          const dates = process.env.SEAT_DATES;
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `The Odyssey — seats freed up for ${dates}`,
            assignees: [context.repo.owner],
            body: [
              `Returned or released seats detected for **${dates}** at IMAX Sydney.`,
              '',
              process.env.SEAT_BODY,
              'Seat counts are from the moment of the check — book quickly.',
            ].join('\n'),
          });
